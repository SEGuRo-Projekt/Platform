name: Test with Docker Compose

permissions:
  packages: write

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compose:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13.12"

      - name: Install dependencies
        run: uv sync --no-group docs

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Docker Compose cache file
        run: uv run python scripts/generate-compose-cache.py

      - name: Create .env file
        run: sed 's/PLEASE-CHANGE-ME/7418GOKUjD4npqnfBi3uDVsrIoqgiEJD/g' .env.example > .env

      - name: Build Docker Compose
        run: |
          docker buildx bake \
            --file compose.yaml \
            --file compose-cache.json \
            --set docs.cache-to= \
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '--set *.cache-to=' || '' }}

      - name: Start containers
        run: docker compose up --detach --quiet-pull

      - name: Ensure S3 buckets exist
        run: docker compose up setup-minio

      - name: Test with pytest
        env:
          S3_HOST: localhost
          MQTT_HOST: localhost
        run: uv run pytest

      - name: Get Docker Compose log output
        if: always()
        run: |
          mkdir logs
          for SERVICE in $(docker compose ps --services); do
            echo "::group::Service ${SERVICE}"
            docker compose logs ${SERVICE} | tee logs/${SERVICE}.log
            echo "::endgroup::"
          done

      - name: Archive Docker Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: logs

      - name: Stop containers
        if: always()
        run: docker compose down
